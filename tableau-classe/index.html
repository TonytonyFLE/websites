<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de classe Didac</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css?v=1.11.0">
</head>
<body>
<header class="top">
  <button type="button" class="side-tog home-tog" id="btnHome"></button>
  <button type="button" class="side-tog" id="btnSide" aria-controls="side"></button>
  <div class="brand"><img src="assets/logo-blanc.png" alt="didac"><span class="claim" data-t="claim"></span></div>
  <div class="top-actions">
    <button type="button" class="top-btn" id="btnClasses"></button>
    <button type="button" class="top-btn" id="btnProf"></button>
    <button type="button" class="top-btn" id="btnFull"></button>
  </div>
</header>

<aside class="side" id="side">
  <div class="side-head"><select class="inp side-course" id="sideCourse"></select><button type="button" class="side-x" id="sideHide"></button></div>
  <b class="side-t" id="sideTitle"></b>
  <div class="side-acts"><button type="button" class="btn btn--s" data-act="addPage" id="sideAdd"></button><button type="button" class="btn btn--ghost btn--s" data-act="catalog" id="sideCat"></button></div>
  <input class="inp side-q" id="sideQ" type="search">
  <nav class="side-list" id="tabs"></nav>
  <div class="side-foot">
    <div class="seg-top seg-side" role="group" aria-label="Langue / Sprache / Language / Lingua">
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="it">IT</button>
    </div>
  </div>
</aside>

<section class="home" id="home" hidden></section>

<main class="board" id="board">
  <div class="empty" id="empty"><div class="empty-card"><h2 data-t="emptyTitle"></h2><p data-t="emptyText"></p><button class="btn" id="emptyTpl" data-t="fromTemplate"></button></div></div>
</main>

<footer class="dock" id="dock" aria-label="Outils"></footer>

<dialog class="dlg" id="dlg"><div class="dlg-body" id="dlgBody"></div></dialog>
<iframe id="printFrame" title="print" style="position:absolute;width:0;height:0;border:0;left:-9999px"></iframe>

<script src="icones.js?v=1.11.0"></script>
<script src="i18n.js?v=1.11.0"></script>
<script>window.DIDAC_V = '1.11.0';
/* charge la langue EN / IT avant le premier affichage */
try { var dl = (JSON.parse(localStorage.getItem('didac-tableau-v1') || 'null') || {}).lang || (navigator.language || '').slice(0, 2).toLowerCase();
  if (dl === 'en' || dl === 'it') document.write('<script src="i18n-' + dl + '.js?v=' + window.DIDAC_V + '"><\/script>'); } catch (e) {}</script>
<script src="app.js?v=1.11.0"></script>
<script src="prof.js?v=1.11.0"></script>
</body>
</html>
